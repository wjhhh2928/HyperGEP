[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergep-research"
version = "0.1.0"
description = "Corrected HyperGEP maize prediction workflow"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["hypergep*", "experiments*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
